

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>miduChat</title>

<script type="module">
  import { io } from 'https://cdn.socket.io/4.8.1/socket.io.esm.min.js'

  const getUsername = async () => {
    const savedUsername = localStorage.getItem('username')
    if (savedUsername && savedUsername !== 'undefined') {
      console.log('Usando username guardado:', savedUsername)
      return savedUsername
    }

    const res = await fetch('https://randomuser.me/api/')
    const data = await res.json()
    const randomUsername = data.results[0].login.username
    localStorage.setItem('username', randomUsername)
    console.log('Nuevo username generado:', randomUsername)
    return randomUsername
  }

  const main = async () => {
    const username = await getUsername()
    console.log('Enviando username al servidor:', username)

    const socket = io('http://localhost:3000', {
      auth: {
        username,
        serverOffset: 0
      }
    })

    socket.on('connect', () => {
      console.log('Conectado al servidor con ID:', socket.id)
    })

    const messages = document.getElementById('messages')

    socket.on('chat message', (msg, serverOffset, user) => {
      console.log('[CLIENTE] Mensaje recibido:', { msg, serverOffset, user })

      const item = `<li><p>${msg}</p><small>${user}</small></li>`
      messages.insertAdjacentHTML('beforeend', item)

      // 🔽 Esperamos que el DOM renderice y luego hacemos scroll
      requestAnimationFrame(() => {
        messages.scrollTop = messages.scrollHeight
        // O alternativamente:
        // messages.lastElementChild?.scrollIntoView({ behavior: 'smooth' })
      })
    })

    const form = document.getElementById('form')
    const input = document.getElementById('input')

    form.addEventListener('submit', (e) => {
      e.preventDefault()
      if (input.value.trim()) {
        socket.emit('chat message', input.value.trim())
        input.value = ''
      }
    })
  }

  main()
</script>





  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: grid;
      place-content: center;
      height: 100vh;
      padding: 36px 36px 100px 36px;
      grid-template-rows: 1fr;
    }

    #messages {
      list-style-type: none;
      margin: 0;
      padding: 0;
      overflow-y: scroll;
      height: 100%;
      scroll-behavior: smooth;
      padding-bottom: 48px;
    }

    #messages>li {
      padding: .5rem 1rem;
    }

    #messages>li:nth-child(odd) {
      background: #000;
    }

    #chat {
      border: 1px solid #ccc;
      border-radius: 4px;
      overflow: hidden;
      width: 350px;
      height: 100%;
      position: relative;
    }

    #form {
      bottom: 0;
      display: flex;
      height: 48px;
      left: 0;
      padding: 4px;
      position: absolute;
      right: 0;
    }

    #input {
      border-radius: 9999px;
      border: 1px solid #eee;
      flex: 1;
      margin: 4px;
      padding: 0 8px;
    }

    #input:focus {
      outline: 0;
    }

    #form>button {
      background: #09f;
      color: #fff;
      border: 0;
      margin: 4px;
      border-radius: 4px;
    }

    #form>button:hover {
      background: #0cf;
    }
  </style>
</head>

<body>
  <section id="chat">
    <ul id="messages"></ul>
    <form id="form">
      <input type="text" name="message" id="input" placeholder="Type a message" autocomplete="off" />
      <button type="submit">Enviar</button>
    </form>
  </section>

</body>

</html>
